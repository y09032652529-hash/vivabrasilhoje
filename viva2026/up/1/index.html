<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transforme sua vida hoje!</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap-icons.css">
    
    <script src="js/notiflix-aio-3.2.8.min.js"></script>
    <link href="css/notiflix.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #1d4ed8;
            --primary-green: #22c55e;
            --hover-green: #16a34a;
            --light-green-bg: #f0fdf4;
            --accent-yellow: #FFC107;
            --neon-red: #ef4444;
            
            --cta-blue-top: #00c6ff;
            --cta-blue-bottom: #0072ff;
            --cta-blue-glow: rgba(0, 114, 255, 0.4);

            --dark-text: #1e293b;
            --gray-text: #64748b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-text);
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        @keyframes pulseText { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

        .cartelas-section { padding: 1rem 0 0 0; }
        .cartelas-container { max-width: 950px; margin: 0 auto; padding: 0 1.5rem; }

        .page-header { text-align: center; margin-bottom: 1rem; padding: 0.25rem 0; }
        .main-logo { 
            width: 100%; max-width: 600px; margin: 0 auto 0.25rem auto; display: block; border-radius: 16px;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.15));
            animation: floatLogo 4s ease-in-out infinite;
        }
        @keyframes floatLogo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .page-subtitle { 
            font-size: 1.15rem; 
            color: var(--gray-text); 
            max-width: 800px; 
            margin: 0 auto; 
            font-weight: 500; 
            line-height: 1.5; 
        }
        .page-subtitle b { color: var(--dark-text); font-weight: 800; }

        .cartelas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2.5rem; margin-bottom: 2rem; margin-top: 0.5rem; }

        .cartela-card {
            background: var(--card-bg); border-radius: 20px; overflow: hidden;
            transition: all 0.3s ease; box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            border: 1px solid var(--card-border); position: relative;
            display: flex; flex-direction: column;
        }
        .cartela-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.12); border-color: #cbd5e1; }

        .cartela-image-wrapper { position: relative; width: 100%; height: 220px; overflow: hidden; border-bottom: 4px solid var(--primary-green); }
        .cartela-image { width: 100%; height: 100%; object-fit: cover; object-position: center; transition: transform 0.5s ease; }
        .cartela-card:hover .cartela-image { transform: scale(1.05); }

        .badge-receba-hora {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--accent-yellow);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(255, 193, 7, 0.4);
            z-index: 10;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.5px;
            animation: neonPulseYellowTag 1.5s infinite alternate;
        }
        @keyframes neonPulseYellowTag { 
            from { box-shadow: 0 0 5px var(--accent-yellow), 0 0 10px var(--accent-yellow); opacity: 0.9; } 
            to { box-shadow: 0 0 10px var(--accent-yellow), 0 0 20px var(--accent-yellow); opacity: 1; } 
        }

        .price-badge-neon-green {
            position: absolute; top: 12px; right: 12px; background: var(--primary-green);
            color: #fff; padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 0.95rem; 
            z-index: 2; display: flex; align-items: center; gap: 4px; animation: neonPulseGreen 1.5s infinite alternate;
        }
        @keyframes neonPulseGreen { 
            from { box-shadow: 0 0 5px var(--primary-green), 0 0 10px var(--primary-green); opacity: 0.9; } 
            to { box-shadow: 0 0 10px var(--primary-green), 0 0 20px var(--primary-green); opacity: 1; } 
        }

        .cartela-content { padding: 1.25rem; flex-grow: 1; display: flex; flex-direction: column; }

        .prize-info-box { border-radius: 12px; padding: 10px; text-align: center; margin-bottom: 15px; position: relative; }
        .prize-gold { background-color: #fffbeb; border: 2px dashed #f59e0b; }
        .prize-gold .prize-label { color: #b45309; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .prize-gold .prize-value { color: #d97706; font-weight: 900; font-size: 1.8rem; line-height: 1; }
        
        .prize-bronze { background-color: #fdf5eb; border: 2px dashed #cd7f32; }
        .prize-bronze .prize-label { color: #8b5a2b; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .prize-bronze .prize-value { color: #cd7f32; font-weight: 900; font-size: 1.8rem; line-height: 1; }

        .buy-buttons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: auto; }
        .btn-buy { border-radius: 10px; padding: 12px 5px; font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease; position: relative; line-height: 1.2; display: flex; flex-direction: column; align-items: center; justify-content: center; border: none; }
        .btn-buy span { font-weight: 600; font-size: 0.8rem; margin-top: 2px; }
        .btn-buy:active { transform: translateY(2px); }

        .btn-1 { grid-column: 1; background: #ffffff; border: 2px solid #cbd5e1; color: var(--dark-text); }
        .btn-1:hover { background: #f1f5f9; border-color: #94a3b8; }
        .btn-1 span { color: var(--gray-text); }

        .btn-3 { grid-column: 2; background: #dcfce7; border: 2px solid #86efac; color: #166534; }
        .btn-3:hover { background: #bbf7d0; }
        .btn-3 span { color: #15803d; }

        .btn-5 { 
            grid-column: 1 / span 2; 
            background: linear-gradient(180deg, var(--cta-blue-top) 0%, var(--cta-blue-bottom) 100%);
            color: white; font-size: clamp(0.9rem, 4.5vw, 1.1rem); padding: 14px; white-space: nowrap;
            box-shadow: 0 6px 0 #0056b3, 0 10px 20px var(--cta-blue-glow);
            animation: glowingBlueBtn 2s infinite;
        }
        .btn-5:active { box-shadow: 0 2px 0 #0056b3; transform: translateY(4px); animation: none; }
        .btn-5 span { color: #e0f2fe; }
        @keyframes glowingBlueBtn { 
            0%, 100% { box-shadow: 0 6px 0 #0056b3, 0 0 10px var(--cta-blue-glow); transform: scale(1); } 
            50% { box-shadow: 0 6px 0 #0056b3, 0 0 25px var(--cta-blue-glow); transform: scale(1.05); } 
        }

        .discount-badge {
            position: absolute; top: -14px; right: -10px; background: var(--accent-yellow); color: #000;
            font-size: 0.75rem; font-weight: 900; padding: 5px 12px; border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25); z-index: 2; text-transform: uppercase;
        }
        
        .best-seller-badge { 
            background: var(--neon-red); 
            color: #ffffff; 
            border: 2px solid var(--accent-yellow); 
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); 
        }
        
        .pulse-anim { animation: pulseDiscount 2s infinite; }
        @keyframes pulseDiscount { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .footer-winners-section { max-width: 550px; margin: 0 auto 3rem auto; padding: 0 1.5rem; }
        .footer-winners-title { font-size: 1.2rem; font-weight: 900; color: var(--dark-text); text-align: center; margin-bottom: 1.5rem; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .winners-feed-list { display: flex; flex-direction: column; gap: 12px; overflow: hidden; }

        .winner-feed-item {
            display: flex; align-items: center; gap: 15px;
            background: var(--card-bg); border: 1px solid var(--card-border);
            padding: 12px 20px; border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            animation: slideDownFade 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform-origin: top center;
        }

        .winner-feed-item.removing { animation: fadeOutUp 0.5s ease forwards; }
        .winner-prize-img { width: 45px; height: 45px; object-fit: contain; background: var(--bg-color); border-radius: 50%; padding: 4px; border: 1px solid var(--card-border);}
        .winner-info { display: flex; flex-direction: column; line-height: 1.3; }
        .winner-name { font-weight: 800; font-size: 0.95rem; color: var(--dark-text); display: flex; align-items: center; gap: 4px; }
        .verified-icon { color: var(--primary-green); font-size: 0.85rem; }
        .winner-prize-name { font-size: 0.8rem; color: var(--gray-text); font-weight: 600; }

        @keyframes slideDownFade { from { opacity: 0; transform: translateY(-30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fadeOutUp { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.95); } }

        @media (max-width: 480px) {
            .cartelas-grid { grid-template-columns: 1fr; gap: 2rem; }
            .cartela-image-wrapper { height: 190px; }
            .prize-gold .prize-value, .prize-bronze .prize-value { font-size: 1.6rem; }
            .badge-receba-hora { font-size: 0.8rem; padding: 4px 8px; right: 8px; top: 8px; }
            .price-badge-neon-green { font-size: 0.8rem; padding: 4px 8px; right: 8px; top: 8px; }
        }
    </style>
</head>
<body>

    <section class="cartelas-section">
        <div class="cartelas-container">
            
            <div class="page-header">
                <img src="images/Sem%20nome%20%28600%20x%20250%20px%29.jpg" class="main-logo" alt="Tesouro da Sorte">
                <p class="page-subtitle">
                     Parabéns, você foi SELECIONADO!
                     Aproveite suas 5 Chances Grátis para concorrer a até <b>10 MIL REAIS</b>
                </p>
            </div>
            
            <div class="cartelas-grid" id="cartelasGrid">
                
                <div class="cartela-card">
                    <div class="cartela-image-wrapper">
                        <div class="badge-receba-hora">
                            <i class="bi bi-lightning-charge-fill"></i> RECEBA NA HORA!
                        </div>
                        <img src="images/Gemini_Generated_Image_7dpb517dpb517dpb.jpg" alt="PIX Turbinado" class="cartela-image">
                    </div>
                    
                    <div class="cartela-content">
                        <div class="prize-info-box prize-bronze">
                            <div class="prize-label">CONCORRA A ATÉ</div>
                            <div class="prize-value">10 MIL NO PIX</div>
                        </div>

                        <div class="buy-buttons-grid">
                            <button class="btn-buy btn-5" data-url="../2/">
                                RESGATAR MINHAS CHANCES!
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <section class="footer-winners-section">
        <h3 class="footer-winners-title">
            <i class="bi bi-broadcast" style="color: var(--neon-red); animation: pulseText 1.5s infinite;"></i> 
            ÚLTIMOS GANHADORES
        </h3>
        <div class="winners-feed-list" id="winnersFeedList"><div class="winner-feed-item"><img src="images/Premios%20%287%29.jpg" alt="Prêmio" class="winner-prize-img"><div class="winner-info"><span class="winner-name">Letícia T. <i class="bi bi-patch-check-fill verified-icon"></i></span><span class="winner-prize-name">ganhou Airfryer</span></div></div><div class="winner-feed-item"><img src="images/Premios%20%286%29.jpg" alt="Prêmio" class="winner-prize-img"><div class="winner-info"><span class="winner-name">Paula C. <i class="bi bi-patch-check-fill verified-icon"></i></span><span class="winner-prize-name">ganhou iPhone 15</span></div></div><div class="winner-feed-item"><img src="images/Premios%20%287%29.jpg" alt="Prêmio" class="winner-prize-img"><div class="winner-info"><span class="winner-name">Amanda G. <i class="bi bi-patch-check-fill verified-icon"></i></span><span class="winner-prize-name">ganhou Airfryer</span></div></div></div>
    </section>

   <script>
        document.addEventListener('DOMContentLoaded', function() {
            const names =  ["João S.", "Maria S.", "Carlos A.", "Ana P.", "Lucas M.", "Fernanda R.", "Pedro H.", "Paula C.", "Marcos F.", "Julia M.", "Rafael D.", "Camila V.", "Bruno B.", "Amanda G.", "Thiago K.", "Letícia T.", "Diego W.", "Beatriz N.", "Rodrigo P.", "Larissa S.", "Gustavo C.", "Isabela M."];
            const prizesData = [{ name: "iPhone 15", img: "images/Premios (6).jpg", isChance: false }, { name: "Playstation 5", img: "images/Premios (6).jpg", isChance: false }, { name: "Moto 0KM", img: "images/Premios (2).jpg", isChance: false }, { name: "Carro 0KM", img: "images/Premios (4).jpg", isChance: false }, { name: "Airfryer", img: "images/Premios (7).jpg", isChance: false }, { name: "R$ 10.000,00 no PIX", img: "images/Premios (5).jpg", isChance: false }, { name: "Chances", img: "images/Design sem nome (87).jpg", isChance: true }];
            const feedList = document.getElementById('winnersFeedList');

            function createFeedItemHTML() {
                const rName = names[Math.floor(Math.random() * names.length)];
                const rPrize = prizesData[Math.floor(Math.random() * prizesData.length)];
                let finalPrizeName = rPrize.name;
                if(rPrize.isChance) { finalPrizeName = `+${Math.floor(Math.random() * 5) + 1} Chances Extras`; }
                const item = document.createElement('div');
                item.className = 'winner-feed-item';
                item.innerHTML = `<img src="${rPrize.img}" alt="Prêmio" class="winner-prize-img"><div class="winner-info"><span class="winner-name">${rName} <i class="bi bi-patch-check-fill verified-icon"></i></span><span class="winner-prize-name">ganhou ${finalPrizeName}</span></div>`;
                return item;
            }

            for(let i=0; i<3; i++) { feedList.appendChild(createFeedItemHTML()); }

            function triggerFeedUpdate() {
                const newItem = createFeedItemHTML();
                feedList.prepend(newItem);
                if(feedList.children.length > 4) {
                    const lastChild = feedList.lastElementChild;
                    lastChild.classList.add('removing');
                    setTimeout(() => { if(lastChild.parentNode) lastChild.remove(); }, 500); 
                }
                setTimeout(triggerFeedUpdate, Math.floor(Math.random() * (15000 - 8000 + 1)) + 8000);
            }
            setTimeout(triggerFeedUpdate, 3000);

            const buyButtons = document.querySelectorAll('.btn-buy');
            Notiflix.Notify.init({ width: '320px', position: 'right-top', fontFamily: 'Poppins' });
            
            // ==============================================================
            // SCRIPT ATUALIZADO PARA LER O LINK DO BOTÃO E REDIRECIONAR
            // ==============================================================
            buyButtons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault(); 
                    
                    // Pega a URL contida no botão que foi clicado
                    const targetUrl = this.getAttribute('data-url');
                    
                    const originalContent = this.innerHTML;
                    
                    // Animação de carregamento visual
                    this.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="width: 1.5rem; height: 1.5rem; border: 0.2em solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spinner-border .75s linear infinite; display: inline-block;"></span>';
                    this.style.pointerEvents = 'none';
                    
                    Notiflix.Notify.success(`Redirecionando...`);
                    
                    // Delay de 1.2 segundos para processamento visual e então redireciona
                    setTimeout(() => {
                        if (targetUrl) {
                            window.location.href = targetUrl;
                        } else {
                            // Prevenção de erro caso falte atributo (volta o botão ao normal)
                            this.innerHTML = originalContent;
                            this.style.pointerEvents = 'auto';
                        }
                    }, 1200); 
                });
            });
        });
    </script>

</body></html>
